[project]
name = "geo-trace"
description = "Fast and memory-efficient reverse geocoding library"
readme = "README.md"
authors = [
  { name = "Tal Amuyal", email = "TalAmuyal@gmail.com" },
]
license = { file = "LICENSE.txt" }
requires-python = ">=3.8,<3.13"
keywords = ["geocoding"]
classifiers = [
    "Development Status :: 4 - Beta", # "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
repository = "https://github.com/TalAmuyal/geo-trace"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/TalAmuyal/geo-trace"
documentation = "https://github.com/TalAmuyal/geo-trace"
changelog = "https://github.com/TalAmuyal/geo-trace/releases"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
